# Publishes the game to GitHub Pages on every push to main, after the tests pass.
#
# Site layout:
#   /             experimenter console   (src/index.html)
#   /display.html participant display    (src/display.html); labmate links point here
#   /prototype/   the original v0.1 single-file prototype (index.html at the repo root)
#
# One-time setup by the repository owner: Settings > Pages > Build and
# deployment > Source: "GitHub Actions". Until then the deploy step fails.

name: Publish the game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false   # no dependencies, no lock file
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/prototype
          cp -R src/. _site/
          cp index.html _site/prototype/index.html
          ls -R _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
