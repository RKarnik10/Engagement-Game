<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Participant display</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body class="display-page">
<!-- The participant's screen. Only the grey field and the moles; the
     experimenter controls everything from the console tab. -->
<div class="stage display-stage" id="stage" tabindex="0">
  <div class="holes grid3x3 skin-mole" id="holes"></div>
  <div class="keycaps grid3x3" id="keycaps"></div>
  <div class="overlay" id="overlay" aria-live="polite">
    <div class="overlay-card">
      <h3 id="ov-title">Ready</h3>
      <div id="ov-body"></div>
    </div>
  </div>
  <p class="display-hint" id="hint">Press <kbd>F</kbd> for full screen. This tab must stay visible during a run.</p>
</div>
<script type="module" src="./display.js"></script>
</body>
</html>
